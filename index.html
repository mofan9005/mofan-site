    <script>// Hash routes share one HTML document; preload only the active route's hero.
const mobile=matchMedia('(max-width:700px)').matches;
const route=location.hash.slice(1).replace(/^\//,'')||'home';
const heroes={home:['/images/home-turntable-codex-v3.svg','/images/v2/home-disc.svg'],courses:[`/images/v2/course-pool-${mobile?'portrait':'landscape'}.svg`],about:['/images/example-about.svg'],brief:['/images/v2/brief-newspaper.svg']};
for(const src of heroes[route]||[]){const link=document.createElement('link');link.rel='preload';link.as='image';link.fetchPriority='high';link.href=mobile?src.replace('.svg','-mobile.svg'):src;document.head.append(link);}
</script>
    <title>Example</title>
  </head>
